name: Global Revenue Brain
# Algora official source enabled

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/global-revenue-brain.yml"
      - "01_GLOBAL_REVENUE_BRAIN/**/*.py"
      - "02_DISCOVERY/superteam_earn_official_adapter.py"
      - "01_GLOBAL_REVENUE_BRAIN/01_CONFIG/requirements-lock.txt"
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: global-revenue-brain
  cancel-in-progress: false

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      BRAIN_GEMINI_MODEL: "gemini-3-flash-preview"
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout Brain
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: 01_GLOBAL_REVENUE_BRAIN/01_CONFIG/requirements-lock.txt

      - name: Set up Bun for TypeScript task validation
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: pip install -r 01_GLOBAL_REVENUE_BRAIN/01_CONFIG/requirements-lock.txt

      - name: Verify Gemini connection once
        run: python 01_GLOBAL_REVENUE_BRAIN/01_EXECUTION/gemini_smoke_check.py

      - name: Validate Python source
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          files = list(Path("01_GLOBAL_REVENUE_BRAIN").rglob("*.py"))
          for path in files:
              ast.parse(path.read_text(encoding="utf-8-sig"), filename=str(path))
          print(f"Validated {len(files)} Python files")
          PY

      - name: Run discovery and prioritization
        run: python 01_GLOBAL_REVENUE_BRAIN/10_SCRIPTS/run_revenue_pipeline.py

      - name: Deep verify new opportunities
        run: |
          python 01_GLOBAL_REVENUE_BRAIN/03_INTELLIGENCE/opportunity_verification_engine.py \
            --limit 50 --timeout 12 --delay 0.15

      - name: Build verified execution queue
        run: python 01_GLOBAL_REVENUE_BRAIN/03_INTELLIGENCE/build_verified_execution_queue.py

      - name: Apply live contextual truth gate
        run: python 01_GLOBAL_REVENUE_BRAIN/03_INTELLIGENCE/github_candidate_truth_gate.py

      - name: Build operational revenue pillars
        run: python 01_GLOBAL_REVENUE_BRAIN/01_EXECUTION/operational_pillars_engine.py

      - name: Run autonomous development executor
        run: python 01_GLOBAL_REVENUE_BRAIN/01_EXECUTION/autonomous_development_executor.py

      - name: Refresh operational exports after development
        run: python 01_GLOBAL_REVENUE_BRAIN/01_EXECUTION/operational_pillars_engine.py

      - name: Validate database
        run: |
          python - <<'PY'
          import sqlite3
          path = "01_GLOBAL_REVENUE_BRAIN/11_DATA/global_revenue_brain.db"
          with sqlite3.connect(path) as database:
              result = database.execute("PRAGMA integrity_check").fetchone()[0]
          if result != "ok":
              raise SystemExit(f"Database integrity failed: {result}")
          print("Database integrity: ok")
          PY

      - name: Persist fresh intelligence
        run: |
          git config user.name "global-revenue-brain[bot]"
          git config user.email "global-revenue-brain[bot]@users.noreply.github.com"
          git add             01_GLOBAL_REVENUE_BRAIN/00_CURRENT_STATE/CURRENT_BEST_TARGET.md \
            01_GLOBAL_REVENUE_BRAIN/04_OPPORTUNITIES/priority_opportunities.csv \
            01_GLOBAL_REVENUE_BRAIN/04_OPPORTUNITIES/global_paid_work_candidates.csv \
            01_GLOBAL_REVENUE_BRAIN/04_OPPORTUNITIES/devpost_hackathons.csv \
            01_GLOBAL_REVENUE_BRAIN/04_OPPORTUNITIES/official_source_candidates.csv \
            01_GLOBAL_REVENUE_BRAIN/04_OPPORTUNITIES/superteam_earn_official_opportunities.csv \
            01_GLOBAL_REVENUE_BRAIN/04_OPPORTUNITIES/superteam_earn_rejected_opportunities.csv \
            01_GLOBAL_REVENUE_BRAIN/04_OPPORTUNITIES/algora_open_bounties.csv \
            01_GLOBAL_REVENUE_BRAIN/04_OPPORTUNITIES/verified_opportunities.csv \
            01_GLOBAL_REVENUE_BRAIN/04_OPPORTUNITIES/VERIFIED_EXECUTION_QUEUE.csv \
            01_GLOBAL_REVENUE_BRAIN/04_OPPORTUNITIES/LIVE_TRUTH_EXECUTION_QUEUE.csv \
            01_GLOBAL_REVENUE_BRAIN/04_OPPORTUNITIES/HUMAN_APPROVAL_QUEUE.csv \
            01_GLOBAL_REVENUE_BRAIN/04_OPPORTUNITIES/REVENUE_OPERATIONS.csv \
            01_GLOBAL_REVENUE_BRAIN/11_DATA/global_revenue_brain.db \
            01_GLOBAL_REVENUE_BRAIN/12_REPORTS/LATEST_REVENUE_OPPORTUNITIES.md \
            01_GLOBAL_REVENUE_BRAIN/12_REPORTS/LATEST_GLOBAL_PAID_WORK_DISCOVERY.md \
            01_GLOBAL_REVENUE_BRAIN/12_REPORTS/LATEST_DEVPOST_HACKATHONS.md \
            01_GLOBAL_REVENUE_BRAIN/12_REPORTS/LATEST_OFFICIAL_SOURCE_ADAPTERS.md \
            01_GLOBAL_REVENUE_BRAIN/12_REPORTS/LATEST_SUPERTEAM_EARN_DISCOVERY.md \
            01_GLOBAL_REVENUE_BRAIN/00_CURRENT_STATE/SUPERTEAM_EARN_SOURCE_STATE.md \
            01_GLOBAL_REVENUE_BRAIN/12_REPORTS/LATEST_ALGORA_OPEN_BOUNTIES.md \
            01_GLOBAL_REVENUE_BRAIN/12_REPORTS/LATEST_VERIFIED_OPPORTUNITIES.md \
            01_GLOBAL_REVENUE_BRAIN/12_REPORTS/LATEST_VERIFIED_EXECUTION_QUEUE.md \
            01_GLOBAL_REVENUE_BRAIN/12_REPORTS/LATEST_LIVE_TRUTH_QUEUE.md \
            01_GLOBAL_REVENUE_BRAIN/12_REPORTS/LATEST_OPERATIONAL_PILLARS.md \
            01_GLOBAL_REVENUE_BRAIN/12_REPORTS/LATEST_AUTONOMOUS_DEVELOPMENT.md
          git add -- \
            01_GLOBAL_REVENUE_BRAIN/12_REPORTS/LATEST_GEMINI_CONNECTION.md
          if git diff --cached --quiet; then
            echo "No intelligence changes to persist."
          else
            git commit -m "Brain: refresh opportunity intelligence"
            git push
          fi
